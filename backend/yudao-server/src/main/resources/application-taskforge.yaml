spring:
  application:
    name: taskforge-backend
  datasource:
    dynamic:
      datasource:
        # 本地默认连接到 docker-compose 提供的 MySQL；库名与端口与根目录 `.env`
        # 中的 TASKFORGE_DB_NAME / TASKFORGE_MYSQL_PORT 保持一致。
        # 如需指向其他数据库实例，可整体覆盖 TASKFORGE_DB_URL。
        master:
          url: "${TASKFORGE_DB_URL:jdbc:mysql://127.0.0.1:${TASKFORGE_MYSQL_PORT:3306}/${TASKFORGE_DB_NAME:taskforge}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}"
          username: ${TASKFORGE_DB_USERNAME:root}
          password: ${TASKFORGE_DB_PASSWORD:taskforge_dev}
        slave:
          url: "${TASKFORGE_DB_URL:jdbc:mysql://127.0.0.1:${TASKFORGE_MYSQL_PORT:3306}/${TASKFORGE_DB_NAME:taskforge}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}"
          username: ${TASKFORGE_DB_USERNAME:root}
          password: ${TASKFORGE_DB_PASSWORD:taskforge_dev}
  # TaskForge 数据底座迁移：脚本位于 yudao-module-agent-biz 的 classpath:db/migration，
  # 已存在的 ruoyi 表结构以 baseline-version=0 记账，随后按 V1~V4 顺序建表，可重复执行。
  # 回滚脚本与说明见 db/rollback/README.md（Flyway 社区版无 undo 命令）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    table: flyway_schema_history
  data:
    redis:
      host: ${TASKFORGE_REDIS_HOST:127.0.0.1}
      port: ${TASKFORGE_REDIS_PORT:6379}
      database: ${TASKFORGE_REDIS_DATABASE:0}
      password: ${TASKFORGE_REDIS_PASSWORD:taskforge_dev}

server:
  port: ${TASKFORGE_BACKEND_PORT:48080}

yudao:
  web:
    admin-ui:
      url: ${TASKFORGE_FRONTEND_URL:http://localhost:3000}
  agent:
    workspace:
      # 宿主机 Git 裸仓库缓存根目录，供 WorktreeManager 复用
      bare-repo-root: ${TASKFORGE_AGENT_BARE_REPO_ROOT:/data/agent-bare-repos}
      # 多仓聚合工作区根目录，每个任务生成独立的 dirA-{taskNo} 目录
      workspace-root: ${TASKFORGE_AGENT_WORKSPACE_ROOT:/data/agent-workspace}
    exec:
      # Codex/Claude 可执行文件，以非交互批处理模式启动
      executable: ${TASKFORGE_AGENT_EXEC_EXECUTABLE:codex}
      # 单次执行超时（ISO-8601 时长），超时终止整个进程树
      timeout: ${TASKFORGE_AGENT_EXEC_TIMEOUT:30m}
      # stdout/stderr 单流捕获上限（字节），超出保留头尾并插入截断标记
      max-output-bytes: ${TASKFORGE_AGENT_EXEC_MAX_OUTPUT_BYTES:262144}
